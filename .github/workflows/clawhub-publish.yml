name: ClawHub Publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview without publishing
        required: true
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.16.0
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.1
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - name: Pack and verify the built package
        run: |
          mkdir release-artifacts
          bun pm pack --ignore-scripts --destination release-artifacts
          python3 scripts/verify-release-package.py release-artifacts release-check
      - name: Check native transports from the packed package
        run: |
          ln -s "$GITHUB_WORKSPACE/node_modules" release-check/package/node_modules
          node test/native-transports.mjs release-check/package > release-artifacts/native-transports.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: speko-clawpack-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifacts/
          if-no-files-found: error

  publish:
    needs: build
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: openclaw/clawhub/.github/workflows/package-publish.yml@9d49df109d4ad3dc8a6ecf05d26b39f46d294721
    with:
      dry_run: ${{ inputs.dry_run }}
      source_ref: ${{ github.sha }}
      package_artifact_name: speko-clawpack-${{ github.run_id }}-${{ github.run_attempt }}
